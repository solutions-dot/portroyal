name: Tivoli mobile browser
on:
  pull_request:
    paths:
      - 'games/tivoli/**'
      - 'tests/tivoli-browser.mjs'
      - '.github/workflows/tivoli-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tivoli-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx -y playwright@1.63.0 install --with-deps chromium
      - run: node tools/build.mjs tivoli
      - name: Check Tivoli at 320px and 390px
        run: npm i --no-save playwright@1.63.0 && node tests/tivoli-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tivoli-mobile-screenshots
          path: tivoli-*.png
